<!DOCTYPE html>
<!-- Thanks to Ferhad, Francisco, and Carter from grad 2022 for the styling on this page. -->

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/head :: head">
    <title id="pageTitle" th:text="${session.title}">Squash Match List</title>
</head>

<body>

<nav th:replace="fragments/navHeader :: navbar"></nav>

<div class="container my-4">

    <h2 class="mb-3 text-center title">Squash Match List</h2>

    <!-- Error message -->
    <h2 class="mb-3 text-center error"
        th:if="${not #strings.isEmpty(messageError)}"
        th:text="${messageError}">
        Message from controller
    </h2>

    <!-- Success message -->
    <h2 class="mb-3 text-center success"
        th:if="${not #strings.isEmpty(messageSuccess)}"
        th:text="${messageSuccess}">
        Message success from controller
    </h2>

    <div class="table-responsive">

        <table id="theData"
               class="table table-striped table-hover align-middle">

            <thead class="table-dark text-center">
            <tr>
                <th>ID</th>
                <th>Match Date</th>
                <th>Created Date/Time</th>
                <th>Player 1</th>
                <th>Player 2</th>

                <th>Game 1 P1</th>
                <th>Game 1 P2</th>

                <th>Game 2 P1</th>
                <th>Game 2 P2</th>

                <th>Game 3 P1</th>
                <th>Game 3 P2</th>

                <th>Game 4 P1</th>
                <th>Game 4 P2</th>

                <th>Game 5 P1</th>
                <th>Game 5 P2</th>

                <th>Winner</th>
                <th>Options</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="current : ${squashMatches}">

                <td th:text="${current.id}"></td>
                <td th:text="${current.matchDate}"></td>
                <td th:text="${current.createdDateTime}"></td>
                <td th:text="${current.player1Name}"></td>
                <td th:text="${current.player2Name}"></td>

                <td th:text="${current.player1Game1Score}"></td>
                <td th:text="${current.player2Game1Score}"></td>

                <td th:text="${current.player1Game2Score}"></td>
                <td th:text="${current.player2Game2Score}"></td>

                <td th:text="${current.player1Game3Score}"></td>
                <td th:text="${current.player2Game3Score}"></td>

                <td th:text="${current.player1Game4Score}"></td>
                <td th:text="${current.player2Game4Score}"></td>

                <td th:text="${current.player1Game5Score}"></td>
                <td th:text="${current.player2Game5Score}"></td>

                <td th:text="${current.winnerName}"></td>

                <td class="text-center">
                    <div class="btn-group" role="group">

                        <!-- Edit match -->
                        <a th:href="@{/squashmatch/edit/{id}(id=${current.id})}"
                           class="btn btn-sm btn-outline-primary"
                           title="Edit">
                            <i class="accent fas fa-edit"></i>
                        </a>

                        <!-- Delete match -->
                        <a th:href="@{/squashmatch/delete/{id}(id=${current.id})}"
                           class="btn btn-sm btn-outline-danger"
                           title="Delete">
                            <i class="accent fas fa-trash"></i>
                        </a>

                    </div>
                </td>

            </tr>

            <!-- Message when no data exists -->
            <tr th:if="${#lists.isEmpty(squashMatches)}">
                <td colspan="17"
                    class="text-center text-muted py-4">
                    No squash matches found.
                </td>
            </tr>

            </tbody>

        </table>

    </div>

    <!-- Add new match button -->
    <div class="text-center mt-3">
        <a th:href="@{/squashmatch/add}"
           href="/squashmatch/add"
           class="accent accent-background btn btn-success">

            <i class="fas fa-plus"></i>
            Add New Match

        </a>
    </div>

</div>

<footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
