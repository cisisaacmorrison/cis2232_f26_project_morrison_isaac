<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head">
    <title id="pageTitle">Report</title>
</head>
<body>
<style scoped="scoped">input:not(.hidden) {
    display: inline-block;
    float: right
}

.cd {
    color: #F00 !important;
    font-weight: bold;
    margin-bottom: -48px
}

label {
    margin-right: 8px
}</style>
<nav th:replace="fragments/navHeader :: navbar"></nav>


<div class="container has-text-centered">
    <h2 class="title is-2" th:text="#{label.report.player.name.report}">_</h2>

    <form th:action="@{/report/player/name/submit}" method="post" class="wbb"
          style="display:inline-block;text-align:left!important">
        <label th:text="#{label.report.player.name.report}">Player Name: </label>
        <input type="text"  th:field="${reportInput.name}"></input>
        <br></br>
        <button style="display:block;margin-top:24px!important" class="centered">Submit</button>
    </form>

    </br></br>
    <p th:if="${not #strings.isEmpty(message)}" th:text="#{error.message.no.data.found.name}">not found</p>
    <!--https://stackoverflow.com/a/33106495-->
    <table class="wbb centered" th:if="${not #lists.isEmpty(reportInput.squashMatches)}">
        <thead>
        <tr>
            <th>Date</th>
            <th>Opponent</th>
            <th>Result</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="item : ${reportInput.squashMatches}">

            <td th:text="${item.matchDate}">
                date here
            </td>

<!--            TODO - what if player 1 name and player 2 name both contain the name entered?-->
            <td th:text="${#strings.containsIgnoreCase(item.player1Name,reportInput.name) ? item.player2Name : item.player1Name}">
                opponent here
            </td>
<!--            th:if="${#strings.containsIgnoreCase(user.email, 'gmail.com')}">-->
            <td th:text="${#strings.containsIgnoreCase(item.winnerName,reportInput.name) ? 'WIN' : 'LOSS'}">
                result here
            </td>

        </tr>
        </tbody>
    </table>

</div>

<br></br>

<footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
